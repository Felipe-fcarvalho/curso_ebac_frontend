<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="https://placehold.co/180" id="avatar" alt="Foto de perfil">
            <h1 class="profile-name" id="name">Felipe F Carvalho</h1>
            <h2 class="profile-username" id="username">@Felipe-fcarvalho</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="https://github.com/Felipe-fcarvalho" class="profile-link" target="_blank" rel="noopener noreferrer" id="link">Ver no Github</a>
        </div>
    </header>

    <script src="main.js"></script>
</body>
</html>
